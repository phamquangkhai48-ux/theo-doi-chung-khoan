# =====================================================================
#  FILE CẤU HÌNH — đây là file DUY NHẤT bạn cần sửa khi muốn thay đổi.
#  Quy tắc: giữ nguyên dấu hai chấm ":" và khoảng trắng đầu dòng.
#  Dòng bắt đầu bằng dấu "#" là ghi chú, chương trình bỏ qua.
# =====================================================================

# ---------------------------------------------------------------------
# 1. DANH SÁCH CỔ PHIẾU
# ---------------------------------------------------------------------
# Nhóm cổ phiếu theo dõi: VN30 hoặc VN100. Chương trình tự lấy danh sách mới nhất
# từ Vietcap. Nếu không lấy được, dùng danh sách VN30 dự phòng bên dưới
# (rổ VN30 kỳ tháng 7/2026, hiệu lực từ 03/08/2026; HOSE rà soát lại vào tháng 1 và tháng 7).
nhom_co_phieu: VN100

vn30_du_phong: [ACB, BID, CTG, HDB, LPB, MBB, SHB, SSB, STB, TCB, VCB, VIB, VPB,
                SSI, TCX, FPT, HPG, GAS, BSR, VJC, VIC, VHM, VRE, VPL,
                MSN, MWG, VNM, MCH, SAB, GVR]

# Muốn theo dõi thêm mã ngoài VN30 thì ghi vào đây, ví dụ: [PNJ, DGC, REE]
co_phieu_them: []

# Các mã ngân hàng / chứng khoán: bỏ qua tiêu chí "nợ/vốn chủ" vì ngành này
# vốn dĩ dùng đòn bẩy cao.
nganh_tai_chinh: [ACB, BID, CTG, HDB, LPB, MBB, SHB, SSB, STB, TCB, VCB, VIB, VPB, TPB,
                  SSI, TCX, VCI, HCM, VND, VCK, VPX]

# ---------------------------------------------------------------------
# 2. DANH MỤC ĐANG NẮM GIỮ (tùy chọn)
# ---------------------------------------------------------------------
# Ghi các mã bạn đang có để nhận cảnh báo cắt lỗ / chốt lời.
# KHO CÔNG KHAI: đừng ghi ở đây (ai cũng đọc được) — hãy cất vào GitHub Secret tên DANH_MUC
# với nội dung giống hệt các dòng "- {ma: ...}" bên dưới. Hai nơi sẽ được gộp lại.
# gia_mua tính theo NGHÌN ĐỒNG (ví dụ 105.5 nghĩa là 105.500 đ).
# Bỏ dấu "#" ở đầu các dòng ví dụ để dùng.
danh_muc: []
#  - {ma: FPT, gia_mua: 105.5, cat_lo_phan_tram: 7, chot_loi_phan_tram: 20}
#  - {ma: HPG, gia_mua: 27.3,  cat_lo_phan_tram: 7, chot_loi_phan_tram: 15}

# ---------------------------------------------------------------------
# 3. DÒNG TIỀN BẤT THƯỜNG (khối lượng, khối ngoại, lệnh mua/bán chủ động)
# ---------------------------------------------------------------------
# Giá trị tính theo TỶ đồng.
dong_tien:
  kl_dot_bien_ngay: [2, 3, 5]       # KL trong ngày (quy đổi cả phiên) gấp 2/3/5 lần TB 20 phiên
  cua_so_phut: 5                    # so sánh khối lượng trong 5 phút gần nhất
  kl_dot_bien_cua_so: 5             # KL 5 phút gấp 5 lần nhịp bình thường của mã đó
  gia_tri_cua_so_toi_thieu_ty: 3    # ...và giá trị khớp trong 5 phút từ 3 tỷ trở lên
  khoi_ngoai_rong_ty: [20, 50, 100, 200]   # khối ngoại mua/bán ròng trong ngày vượt các mức này
  khoi_ngoai_cua_so_ty: 10          # khối ngoại mua/bán ròng trong 5 phút từ 10 tỷ
  mua_ban_chu_dong_ty_le: 70        # mua (hoặc bán) chủ động chiếm từ 70% giá trị khớp
  mua_ban_chu_dong_toi_thieu_ty: 5  # ...khi tổng giá trị khớp từ 5 tỷ
  lenh_lon_ty: 2                    # lệnh lớn: một lệnh khớp từ 2 tỷ trở lên
  lenh_lon_phan_tram_gtgd: 0.5      # ...và từ 0,5% giá trị giao dịch TB 1 phiên của mã đó
  so_ma_soi_lenh: 10                # mỗi lần quét soi chi tiết lệnh của tối đa 10 mã bất thường nhất

# ---------------------------------------------------------------------
# 4. TÍN HIỆU BÁO CÁO TÀI CHÍNH (theo quý)
# ---------------------------------------------------------------------
co_ban:
  doanh_thu_tang_yoy: 15      # % tăng doanh thu so với cùng kỳ năm trước
  loi_nhuan_tang_yoy: 20      # % tăng lợi nhuận sau thuế so với cùng kỳ
  loi_nhuan_giam_canh_bao: -20  # giảm quá mức này thì cảnh báo
  roe_toi_thieu: 15           # %
  no_tren_von_chu_toi_da: 1.5 # lần (không áp dụng cho ngành tài chính)
  pe_toi_da: 20
  # Mùa báo cáo: kiểm tra BCTC mỗi ngày trong các khoảng này,
  # ngoài mùa thì chỉ kiểm tra vào thứ Hai hằng tuần.
  mua_bao_cao:
    - {thang: 1,  tu_ngay: 15, den_ngay: 31}
    - {thang: 2,  tu_ngay: 1,  den_ngay: 15}
    - {thang: 3,  tu_ngay: 20, den_ngay: 31}   # BCTC năm kiểm toán
    - {thang: 4,  tu_ngay: 1,  den_ngay: 30}
    - {thang: 5,  tu_ngay: 1,  den_ngay: 15}
    - {thang: 7,  tu_ngay: 15, den_ngay: 31}
    - {thang: 8,  tu_ngay: 1,  den_ngay: 31}   # gồm cả BCTC bán niên soát xét
    - {thang: 10, tu_ngay: 15, den_ngay: 31}
    - {thang: 11, tu_ngay: 1,  den_ngay: 15}

# ---------------------------------------------------------------------
# 5. CHỈ SỐ VĨ MÔ
# ---------------------------------------------------------------------
# "nguong_ngay": cảnh báo khi biến động trong 1 phiên vượt mức này (%).
# Với lợi suất trái phiếu: đơn vị là điểm phần trăm (0.15 = 15 điểm cơ bản).
vi_mo:
  chi_so:
    - {ten: "S&P 500",        ma: "^GSPC",     nhom: my,     nguong_ngay: 2}
    - {ten: "Nasdaq",         ma: "^IXIC",     nhom: my,     nguong_ngay: 2.5}
    - {ten: "Dow Jones",      ma: "^DJI",      nhom: my,     nguong_ngay: 2}
    - {ten: "Nikkei 225",     ma: "^N225",     nhom: chau_a, nguong_ngay: 2.5}
    - {ten: "Shanghai",       ma: "000001.SS", nhom: chau_a, nguong_ngay: 2}
    - {ten: "CSI 300",        ma: "000300.SS", nhom: chau_a, nguong_ngay: 2}
    - {ten: "Hang Seng",      ma: "^HSI",      nhom: chau_a, nguong_ngay: 2.5}
    - {ten: "KOSPI",          ma: "^KS11",     nhom: chau_a, nguong_ngay: 2.5}
    - {ten: "DAX (Đức)",      ma: "^GDAXI",    nhom: chau_au, nguong_ngay: 2}
    - {ten: "FTSE 100 (Anh)", ma: "^FTSE",     nhom: chau_au, nguong_ngay: 2}
    - {ten: "Euro Stoxx 50",  ma: "^STOXX50E", nhom: chau_au, nguong_ngay: 2}
    - {ten: "DXY",            ma: "DX-Y.NYB",  nhom: tien_te, nguong_ngay: 0.7}
    - {ten: "USD/VND (quốc tế)", ma: "USDVND=X", nhom: tien_te, nguong_ngay: 0.3}
    - {ten: "USD/JPY",        ma: "JPY=X",     nhom: tien_te, nguong_ngay: 1}
    - {ten: "USD/CNY",        ma: "CNY=X",     nhom: tien_te, nguong_ngay: 0.5}
    - {ten: "Vàng thế giới",  ma: "GC=F",      nhom: hang_hoa, nguong_ngay: 2}
    - {ten: "Bạc",            ma: "SI=F",      nhom: hang_hoa, nguong_ngay: 3}
    - {ten: "Đồng",           ma: "HG=F",      nhom: hang_hoa, nguong_ngay: 2.5}
    - {ten: "Dầu Brent",      ma: "BZ=F",      nhom: hang_hoa, nguong_ngay: 3}
    - {ten: "Dầu WTI",        ma: "CL=F",      nhom: hang_hoa, nguong_ngay: 3}
    - {ten: "Bitcoin",        ma: "BTC-USD",   nhom: hang_hoa, nguong_ngay: 5}
    - {ten: "Lợi suất 10N Mỹ", ma: "^TNX",     nhom: loi_suat, nguong_ngay: 0.12, la_loi_suat: true}
  # Lợi suất 10 năm Việt Nam và Nhật (lấy từ TradingView, dự phòng FRED cho Nhật)
  loi_suat_khac:
    - {ten: "Lợi suất 10N Nhật", ma_tradingview: "TVC:JP10Y", ma_fred: "IRLTLT01JPM156N", nguong_ngay: 0.08}
    - {ten: "Lợi suất 10N Việt Nam", ma_tradingview: "TVC:VN10Y", nguong_ngay: 0.1}
  # Cảnh báo tổng hợp
  dxy_tang_5_phien: 1.5          # DXY tăng > 1,5% trong 5 phiên
  usdvnd_tang_20_phien: 0.8      # USD/VND tăng > 0,8% trong 20 phiên
  loi_suat_my_tang_5_phien: 0.25 # lợi suất 10N Mỹ tăng > 0,25 điểm % trong 5 phiên
  chenh_lech_vang_sjc_canh_bao: 15   # vàng SJC cao hơn thế giới > 15% thì cảnh báo

# ---------------------------------------------------------------------
# 6. CẬP NHẬT TRONG PHIÊN
# ---------------------------------------------------------------------
# Phiên VN: quét LIÊN TỤC mỗi phút (cảnh báo gửi ngay). Phiên Mỹ (20:00–4:00): 15 phút/lần.
# Chỉ nhắn khi có cảnh báo MỚI; mỗi giờ gửi thêm tóm tắt.
# Muốn tắt cập nhật phiên Mỹ: đổi "bat: true" thành "bat: false".
cap_nhat_15_phut:
  bat: true
  lien_tuc: true                    # phiên VN quét mỗi phút (cần file lịch lien-tuc.yml)
  chu_ky_lien_tuc_giay: 60
  tom_tat_moi_gio: true
  so_ma_top: 5                      # số mã tăng/giảm mạnh nhất hiện trong tóm tắt
  buoc_bien_dong_co_phieu: 3        # báo khi cổ phiếu tăng/giảm vượt mỗi nấc 3% (3%, 6%)
  tran_san: 6.5                     # tăng/giảm từ 6,5% = sát trần/sàn (HOSE ±7%)
  buoc_bien_dong_chi_so_vn: 1.5     # báo khi VN-Index, VN30, HNX tăng/giảm vượt mỗi nấc 1,5%
  # Với chỉ số thế giới, ngưỡng là "nguong_ngay" của từng chỉ số ở mục 5.

# ---------------------------------------------------------------------
# 7. KHÁC
# ---------------------------------------------------------------------
# Nghỉ giữa các lần gọi dữ liệu Vietcap (giây) để không bị chặn.
nghi_giua_cac_lan_goi: 1.5
